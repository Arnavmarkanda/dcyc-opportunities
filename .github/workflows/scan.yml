name: DCYC Opportunity Scanner
 
on:
  schedule:
    - cron: '0 16 * * 1'  # Every Monday at 9:00 AM Mountain Time (UTC-7 standard)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Publish a temporary test listing for the live rendering check; remove it afterward."
        required: false
        default: false
        type: boolean
 
jobs:
  scan:
    runs-on: ubuntu-latest
 
    permissions:
      contents: write     # Allows the agent to commit changes back to the repo
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4
 
      - name: Discover and validate new opportunities
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DCYC_SCANNER_TEST: ${{ inputs.test_mode && '1' || '0' }}
        run: python agent/discover.py
 
      - name: Commit and push if changes were made
        run: |
          git config --global user.name "DCYC Scanner Bot"
          git config --global user.email "scanner@dcyc-opportunities.netlify.app"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-discover verified opportunities on $(date '+%Y-%m-%d')"
          git push
          
